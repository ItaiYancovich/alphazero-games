[package]
name = "uttt_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "uttt_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[features]
default = ["python"]
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
